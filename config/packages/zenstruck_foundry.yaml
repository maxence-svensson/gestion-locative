when@dev: &dev
    zenstruck_foundry:
        faker:
            locale: fr_FR
        persistence:
            # Un seul flush par appel à create()
            flush_once: true
        orm:
            reset:
                # La base est reconstruite en rejouant les migrations (et non depuis les entités) :
                # une migration oubliée ou incorrecte fait échouer les tests.
                mode: migrate

when@test: *dev
