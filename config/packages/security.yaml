security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Pas de « property » : c'est UserRepository::loadUserByIdentifier() qui charge l'utilisateur
        # (il normalise l'e-mail saisi).
        app_user_provider:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: app_dashboard
            logout:
                path: app_logout
                target: app_home
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 7 jours
            # Au-delà de 5 échecs, la connexion est bloquée 15 minutes (par e-mail et par IP)
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    # Chaque espace est protégé par son préfixe d'URL : un nouveau contrôleur placé sous /proprietaire
    # est protégé par défaut, même si on oublie de le faire explicitement.
    # Seule la première règle qui correspond s'applique.
    access_control:
        - { path: ^/proprietaire, roles: ROLE_OWNER }
        - { path: ^/locataire, roles: ROLE_TENANT }
        - { path: ^/espace, roles: IS_AUTHENTICATED }

when@test:
    security:
        password_hashers:
            # Hachage volontairement faible en test, pour la rapidité
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
