services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/app
    depends_on:
      database:
        condition: service_healthy

  # Exécute les tâches planifiées (Scheduler) et les messages asynchrones (e-mails…)
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ['php', 'bin/console', 'messenger:consume', 'scheduler_default', 'async', '--time-limit=3600', '-vv']
    # Le worker s'arrête après une heure (libère la mémoire) et Docker le relance
    restart: unless-stopped
    volumes:
      - ./:/app
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  database_data:
